<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="stripe1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Tiger stripes (3 wavy lines like stream waves) -->
  <g fill="none" stroke="white" stroke-width="28" stroke-linecap="round" opacity="0.9">
    <!-- Left stripe - tall wave -->
    <path d="M145 155 Q125 256 145 357"/>
    <!-- Middle stripe - medium wave offset -->
    <path d="M210 145 Q190 256 210 367"/>
    <!-- Right stripe - subtle wave -->
    <path d="M275 165 Q260 256 275 347"/>
  </g>
  <!-- Play triangle (overlapping stripes, forming streaming symbol) -->
  <path d="M310 180 L310 332 L430 256 Z" fill="white" opacity="0.95"/>
</svg>
